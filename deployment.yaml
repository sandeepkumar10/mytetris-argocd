---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mytetris-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mytetris-dev
  template:
    metadata:
      labels:
        app: mytetris-dev
    spec:
      containers:
        - name: cont1
          image: sandeepkr98/mytetris:v1
          ports:
            - containerPort: 80
